baseURL: https://michaelroy.dev/
locale: en-us
title: Michael Roy
theme: PaperMod

outputs:
  home: [HTML, RSS, JSON]

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10
    - name: Homelab
      url: /homelab/
      weight: 20
    - name: Tags
      url: /tags/
      weight: 30
    - name: About
      url: /about/
      weight: 40
    - identifier: search
      name: "🔍"
      url: /search/
      weight: 50
    - identifier: archive
      name: "📚"
      url: /archives/
      weight: 60

params:
  assets:
    favicon: /favicon.ico
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png
  label:
    text: "Michael Roy"
    icon: /logo-header.png
    iconHeight: 30
  images:
    - og-image.png

  defaultTheme: auto
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: false
  hideSummary: false
  mainSections:
    - posts

  homeInfoParams:
    Title: "Nice to meet you, I'm Michael"
    Content: "A DevOps engineer with 10+ years in IT and infrastructure operations. I write about my homelab, Kubernetes, Linux, AWS, and self-hosting."
  socialIcons:
    - name: github
      url: https://github.com/its-michaelroy
    - name: linkedin
      url: https://www.linkedin.com/in/michaelroy91/
    - name: email
      url: mailto:michael@michaelroy.dev
        - name: x
      url: https://x.com/its_michaelroy
    - name: rss
      url: https://michaelroy.dev/index.xml

caches:
  images:
    dir: :cacheDir/images
